name: base_structure
description: Enterprise Flutter starter template with Clean Architecture, BLoC, and production-ready patterns.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.8.0+1

  # Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Connectivity
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^2.7.2

  # Navigation
  go_router: ^15.1.2

  # Environment
  flutter_dotenv: ^5.2.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1

  # Permissions & Device
  permission_handler: ^12.0.0+1
  local_auth: ^2.3.0
  device_info_plus: ^11.4.0
  package_info_plus: ^8.3.0

  # Media & Files
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  flutter_image_compress: ^2.4.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.1

  # JSON
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0
  dart_code_metrics_presets: ^2.22.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - env/.env.dev
    - env/.env.qa
    - env/.env.stage
    - env/.env.prod
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/animations/lottie/
    - assets/json/
    - assets/translations/
    - assets/dummy/

  # Add custom fonts under assets/fonts/ and uncomment:
  # fonts:
  #   - family: AppCustom
  #     fonts:
  #       - asset: assets/fonts/AppCustom-Regular.ttf
